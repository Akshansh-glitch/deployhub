apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployhub-backend
  namespace: deployhub-system
  labels:
    app: deployhub-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployhub-backend
  template:
    metadata:
      labels:
        app: deployhub-backend
    spec:
      # Created by Terraform (rbac.tf); allowed to manage resources in the apps namespace only.
      serviceAccountName: deployhub-backend
      containers:
        - name: backend
          # Built straight into Minikube: `minikube image build -t deployhub-backend:local backend`
          image: deployhub-backend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: deployhub-secrets
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/deployhub
            - name: PROMETHEUS_URL
              value: http://kps-prometheus.monitoring:9090
            - name: CORS_ORIGINS
              value: http://localhost:5173
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: deployhub-backend
  namespace: deployhub-system
spec:
  selector:
    app: deployhub-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
