# Copy to secrets.yaml (git-ignored), fill in, then: kubectl apply -f k8s/platform/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: deployhub-secrets
  namespace: deployhub-system
type: Opaque
stringData:
  DB_USER: deployhub
  DB_PASSWORD: change-me
  JWT_SECRET: replace-with-at-least-32-random-characters
  GITHUB_TOKEN: github_pat_xxx
  GITHUB_OWNER: your-github-username
  GITHUB_REPO: deployhub
  APP_DOMAIN: 127.0.0.1.nip.io
  GRAFANA_URL: http://localhost:3000
