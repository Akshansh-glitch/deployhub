# Local development database. The backend and frontend run on your machine; apps run in Minikube.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deployhub
      POSTGRES_USER: deployhub
      POSTGRES_PASSWORD: deployhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployhub"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
